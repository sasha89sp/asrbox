name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-windows:
    name: Build & Verify (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Verify ATLAS and MAP coverage
        run: cargo xtask atlas-check

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Check portable .exe size limit (NF-005 < 25 MB)
        shell: pwsh
        run: |
          $exe = Get-Item "target/release/asrbox.exe"
          $limit = 25 * 1024 * 1024
          $sizeMb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "asrbox.exe size: $sizeMb MB ($($exe.Length) bytes)"
          if ($exe.Length -ge $limit) {
            Write-Error "asrbox.exe exceeds 25 MB limit ($sizeMb MB)"
            exit 1
          }

      - name: Smoke test (--selftest)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\target\release\asrbox.exe" -ArgumentList "--selftest" -Wait -PassThru -ErrorAction Stop
          Write-Host "Selftest exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Selftest exited with code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: asrbox-windows-x64
          path: target/release/asrbox.exe
